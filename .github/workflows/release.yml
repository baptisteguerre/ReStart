# Builds the Chrome and Firefox packages and attaches them to a GitHub release.
# Usage: set "version" in src/manifest.json, then publish a release with the tag v<version>
# (for example v1.0.1). The workflow stops if the tag and the version don't match.
name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: write # needed to attach files to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/.*"version": *"\([0-9.]*\)".*/\1/p' src/manifest.json)
          tag="${GITHUB_REF_NAME#v}"
          echo "Manifest version: $version, release tag: $GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::The tag ($GITHUB_REF_NAME) doesn't match the version in src/manifest.json ($version)."
            exit 1
          fi

      - name: Build
        run: sh build.sh # "sh": files uploaded through the GitHub website lose their executable flag

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
