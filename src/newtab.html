<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="leaves" aria-hidden="true"><i></i><i></i></div>
  <div class="glow" aria-hidden="true"><div class="ray"></div><div class="ray"></div><div class="ray"></div><div class="ray"></div></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <button class="pill-btn awake-btn" id="awake-btn" data-i18n-title="keepAwake" data-i18n-aria-label="keepAwake" aria-haspopup="menu" aria-expanded="false" aria-pressed="false" hidden>
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path id="awake-path"/></svg>
      <span data-i18n="awakeLabel"></span>
      <span class="awake-left" id="awake-left"></span>
    </button>
    <button class="pill-btn" id="focus-btn" data-i18n-title="focusMode" aria-pressed="false">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path id="focus-path"/></svg>
      <span data-i18n="focusLabel"></span>
    </button>
    <button class="icon-btn" id="settings-btn" data-i18n-aria-label="settings" data-i18n-title="settings" aria-haspopup="dialog">
      <svg viewBox="0 -960 960 960" aria-hidden="true"><path id="settings-path"/></svg>
    </button>
  </header>

  <main class="page">
    <section class="bar-row" id="bar-row" data-i18n-aria-label="bookmarksBar"></section>

    <div class="search-wrap">
      <label class="search" for="search">
        <svg viewBox="0 -960 960 960" aria-hidden="true" class="search-ico"><path id="search-path"/></svg>
        <input id="search" type="search" maxlength="200" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false" autofocus>
        <span class="search-enter" id="search-enter" hidden>
          <svg viewBox="0 -960 960 960" aria-hidden="true"><path id="enter-path"/></svg><span data-i18n="open"></span>
        </span>
        <kbd class="search-hint" id="search-hint">Esc</kbd>
      </label>
    </div>

    <div class="board-wrap" id="board-wrap">
      <button class="board-nav prev" id="nav-prev" data-i18n-aria-label="scrollLeft" tabindex="-1">‹</button>
      <section class="board" id="board" data-i18n-aria-label="folders"></section>
      <button class="board-nav next" id="nav-next" data-i18n-aria-label="scrollRight" tabindex="-1">›</button>
    </div>

    <p class="empty-state" id="empty-state" data-i18n="noMatch" hidden></p>
    <p class="start-hint" id="start-hint" hidden></p>
  </main>

  <!-- Focus mode: only the background, the time and (optionally) the sites as icons -->
  <div class="focus-view" id="focus-view" hidden>
    <div class="fc-time" id="fc-time"></div>
    <div class="fc-date" id="fc-date"></div>
    <nav class="fc-icons" id="fc-icons" data-i18n-aria-label="bookmarksBar"></nav>
  </div>

  <div class="popover" id="popover" role="dialog" aria-modal="false" hidden></div>
  <input type="file" id="file-import" accept="application/json,.json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
